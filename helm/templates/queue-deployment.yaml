{{- if .Values.queue.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "queue.fullname" . }}
  labels:
    {{- include "queue.labels" . | nindent 4 }}
spec:
  {{- if not .Values.queue.autoscaling.enabled }}
  replicas: {{ .Values.queue.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      {{- include "queue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.queue.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "queue.labels" . | nindent 8 }}
        {{- with .Values.queue.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.queue.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.queue.podSecurityContext | nindent 8 }}
      containers:
        - name: queue
          securityContext:
            {{- toYaml .Values.queue.securityContext | nindent 12 }}
          image: "{{ .Values.queue.image.repository }}:{{ .Values.queue.image.tag }}"
          imagePullPolicy: {{ .Values.queue.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.queue.service.port }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TZ
              value: {{ .Values.global.timezone | default "America/Vancouver" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.global.logging.level | default "info" | quote }}
            - name: MLE_LOG_TO_FILE
              value: {{ .Values.global.logging.toFile | default true | quote }}
            - name: MLE_LOG_DIR
              {{- if .Values.global.logging.useSharedDataVolume }}
              value: {{ printf "/mnt/data/%s/queue/$(POD_NAME)" (.Values.global.logging.sharedSubdir | default (printf "%s-shared-logs" (include "mleAPI.fullname" .))) | quote }}
              {{- else }}
              value: {{ .Values.queue.persistence.logs.mountPath | default .Values.global.logging.dir | default "/usr/src/app/logs" | quote }}
              {{- end }}
            - name: MLE_QUEUE_LOG_FILE
              value: "queue.log"
            - name: MLE_QUEUE_ERROR_LOG_FILE
              value: "queue-error.log"
            - name: MLE_REDIS_HOST
              value: "{{ include "redis.fullname" . }}-svc"
            - name: MLE_REDIS_PORT
              value: {{ .Values.redis.service.port | quote }}
            - name: MLE_QUEUE_PORT
              value: {{ .Values.queue.service.port | quote }}
            {{- with .Values.queue.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.mleAPI.database.secretName }}
          {{- if .Values.queue.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.queue.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.queue.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.queue.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.queue.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.queue.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.queue.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.queue.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.queue.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.queue.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.queue.resources | nindent 12 }}
          {{- if or (and .Values.queue.persistence.logs.enabled (not .Values.global.logging.useSharedDataVolume)) .Values.queue.volumeMounts }}
          volumeMounts:
            {{- if and .Values.queue.persistence.logs.enabled (not .Values.global.logging.useSharedDataVolume) }}
            - name: logs
              mountPath: {{ .Values.queue.persistence.logs.mountPath | default .Values.global.logging.dir | default "/usr/src/app/logs" | quote }}
              subPathExpr: {{ printf "%s/queue/$(POD_NAME)" (.Values.global.logging.sharedSubdir | default (printf "%s-shared-logs" (include "mleAPI.fullname" .))) | quote }}
            {{- end }}
            {{- with .Values.queue.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (and .Values.queue.persistence.logs.enabled (not .Values.global.logging.useSharedDataVolume)) .Values.queue.volumes }}
      volumes:
        {{- if and .Values.queue.persistence.logs.enabled (not .Values.global.logging.useSharedDataVolume) }}
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.queue.persistence.logs.existingClaim | default (printf "%s-logs-pvc" (include "queue.fullname" .)) }}
        {{- end }}
        {{- with .Values.queue.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.queue.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queue.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.queue.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
